   h+='<div class="bar"><i style="width:'+Math.round(dn/it.steps.length*100)+'%"></i></div>';
   h+='<ul class="steps">';
   it.steps.forEach(function(s2){var on=!!S.steps[s2.id];h+='<li class="'+(on?'done':'')+'" onclick="tgStep(\''+s2.id+'\')"><div class="ck '+(on?'on':'')+'"></div><span class="t">'+esc(s2.text)+'</span></li>'});
   h+='</ul>';
  }
  var t=tl(it.id);
  if(t.length){h+='<ul class="tl">';t.forEach(function(x){h+='<li><i>'+esc(x.time)+'</i>'+esc(x.text)+'</li>'});h+='</ul>'}
  h+='<div class="mini" onclick="addTl(\''+it.id+'\')" style="cursor:pointer">＋ 记录进展</div>';
  if(it.note)h+='<div class="note">'+esc(it.note)+'</div>';
  h+='</div></div></div>';
 });
 document.getElementById('p-req').innerHTML=h;
}
function cycleSt(id){var o=['pending','doing','done'];var c=st(id,'pending');var n=o[(o.indexOf(c)+1)%3];S.status[id]=n;save();renderAll()}
function tgStep(id){S.steps[id]=!S.steps[id];save();renderAll()}
function addTl(id){var v=prompt('记录这条的进展（例：已约阿锋明天上午看）');if(!v)return;if(!S.timeline[id])S.timeline[id]=[];S.timeline[id].push({time:today()+' '+now(),text:v});save();renderAll()}

function renderMem(){
 var h='',total=0,stuck=0;
 D.members.members.forEach(function(m){
  m.projects.forEach(function(pr){
   total++;
   var d=daysBetween(pr.last_report,today());
   if(pr.status!=='已完成'){stuck++}
   if(d!=null&&d>3)stuck++;
  });
 });
 if(stuck)h='<div class="warnbox">有 '+stuck+' 个项目处于半成品或超过 3 天未汇报</div>';else h='<div class="okbox">暂无卡住的跟进项</div>';
 D.members.members.forEach(function(m){
  h+='<div class="sect">'+esc(m.name)+' · '+esc(m.role)+'</div>';
  m.projects.forEach(function(pr){
   var d=daysBetween(pr.last_report,today());
   var w=(d!=null&&d>3)?' style="color:var(--red)"':'';
   h+='<div class="card">'+
   '<p class="rname">'+esc(pr.name)+'<span class="badge b-P2">'+esc(pr.status)+'</span></p>'+
   (pr.blocker?'<p class="rmeta">卡点：'+esc(pr.blocker)+'</p>':'')+
   '<p class="rmeta">最近更新 '+esc(pr.last_update)+'</p>'+
   '<p class="rmeta"'+w+'>'+(pr.last_report?('上次汇报 '+esc(pr.last_report)+(d?('，已 '+d+' 天'):'')):'尚未汇报过')+'</p>'+
   (pr.next_action?'<div class="note">下一步：'+esc(pr.next_action)+'</div>':'')+
   '</div>';
  });
 });
 document.getElementById('p-mem').innerHTML=h;
}

function renderLog(){
 var h='<div class="card"><div class="sect" style="margin:0 0 8px">记一条今天的工作</div>'+
  '<textarea id="wlIn" rows="3" placeholder="例：跟阿锋过了一遍小程序现状，卡在后台权限"></textarea>'+
  '<div class="row"><button class="pri" onclick="addWl()">保存</button></div></div>';
 var all=(D.worklog.items||[]).concat(S.worklog);
 var byd={};all.forEach(function(x){(byd[x.date]=byd[x.date]||[]).push(x)});
 var ds=Object.keys(byd).sort().reverse();
 if(!ds.length)h+='<div class="empty">还没有工作日志</div>';
 ds.forEach(function(d){
  h+='<div class="sect">'+d+'</div>';
  byd[d].forEach(function(x){h+='<div class="log"><div class="d">'+esc(x.time||'')+'</div><div class="c">'+esc(x.content)+'</div></div>'});
 });
 document.getElementById('p-log').innerHTML=h;
}
function addWl(){var v=document.getElementById('wlIn').value.trim();if(!v)return;S.worklog.push({date:today(),time:now(),content:v});save();renderAll()}

function renderAi(){
 var h='<div class="okbox">AI 做的事都记在这，周报会自动统计「AI 杠杆」</div>';
 var all=(D.aiops.items||[]).concat(S.ailog||[]);
 var byd={};all.forEach(function(x){(byd[x.date]=byd[x.date]||[]).push(x)});
 var ds=Object.keys(byd).sort().reverse();
 if(!ds.length)h+='<div class="empty">暂无记录</div>';
 ds.forEach(function(d){
  h+='<div class="sect">'+d+'</div>';
  byd[d].forEach(function(x){h+='<div class="log"><div class="d">'+esc(x.time||'')+' · '+esc(x.tool||'')+'</div><div class="c">'+esc(x.action)+'</div>'+(x.result?'<div class="d">产出：'+esc(x.result)+'</div>':'')+'</div>'});
 });
 document.getElementById('p-ai').innerHTML=h;
}

function renderArch(){
 var h='<div class="card"><div class="sect" style="margin:0 0 8px">存一份发给彩怡总的汇报</div>'+
  '<textarea id="arIn" rows="3" placeholder="把发出去的汇报内容粘一份留底"></textarea>'+
  '<div class="row"><button class="pri" onclick="addAr()">保存</button></div></div>';
 if(!S.archive.length)h+='<div class="empty">暂无汇报存档</div>';
 S.archive.slice().reverse().forEach(function(x){h+='<div class="log"><div class="d">'+esc(x.time)+'</div><div class="c">'+esc(x.content)+'</div></div>'});
 document.getElementById('p-arch').innerHTML=h;
}
function addAr(){var v=document.getElementById('arIn').value.trim();if(!v)return;S.archive.push({time:today()+' '+now(),content:v});save();renderAll()}

function renderRep(){
 var items=D.requirements.items;
 var day=items.filter(function(it){return it.date===today()}).length;
 var done=items.filter(function(it){return st(it.id,it.status)==='done'}).length;
 var wl=(D.worklog.items||[]).concat(S.worklog).filter(function(x){return x.date===today()}).length;
 var ai=(D.aiops.items||[]).length+(S.ailog||[]).length;
 var od=items.filter(function(it){return it.deadline&&it.deadline<today()&&st(it.id,it.status)!=='done'});
 var h='<div class="card"><div class="sect" style="margin:0 0 8px">日报 · '+today()+'</div>'+
  '<p class="rmeta">今日新增要求 '+day+' 条 · 已完成 '+done+' 条 · 工作日志 '+wl+' 条 · AI 操作 '+ai+' 次</p>'+
  (od.length?'<div class="note">逾期未完：'+od.map(function(o){return esc(o.text)}).join('、')+'</div>':'')+
  '<div class="row"><button onclick="genReport(\'night\')">生成并复制</button></div></div>';
 var week=items.filter(function(it){return daysBetween(it.date,today())!=null&&daysBetween(it.date,today())<=7});
 h+='<div class="card"><div class="sect" style="margin:0 0 8px">周报（周一出）</div>'+
  '<p class="rmeta">本周要求 '+week.length+' 条 · 累计完成 '+done+' 条 · AI 操作 '+ai+' 次</p>'+
  '<p class="rmeta">AI 杠杆：本周 AI 完成 '+ai+' 件事，覆盖 '+(new Set((D.aiops.items||[]).map(function(x){return x.tool}))).size+' 类工作流</p></div>';
 h+='<div class="card"><div class="sect" style="margin:0 0 8px">月报（月末出）</div>'+
  '<p class="rmeta">本月累计要求 '+items.length+' 条 · 完成 '+done+' 条 · 完成率 '+Math.round(done/Math.max(items.length,1)*100)+'%</p></div>';
 document.getElementById('p-rep').innerHTML=h;
}

function genReport(type){
 var items=D.requirements.items.slice();
 var ord={P0:0,P1:1,P2:2,'长期':3};
 items.sort(function(a,b){return (ord[a.priority]==null?9:ord[a.priority])-(ord[b.priority]==null?9:ord[b.priority])});
 var t=today(),lines=[];
 if(type==='morning'){
  var act=items.filter(function(it){
   var s=st(it.id,it.status);
   if(s==='done'||it.priority==='长期')return false;
   return it.priority==='P0'||s==='doing'||it.deadline===t;
  });
  if(!act.length){act=items.filter(function(it){return st(it.id,it.status)!=='done'&&it.priority!=='长期'}).slice(0,3)}
  lines.push('彩怡总，今天计划推进 '+act.length+' 件：');
  lines.push('');
  var i=1;
  act.forEach(function(it){
   var s=st(it.id,it.status);
   lines.push(i+'. '+it.text+(it.deadline?('（截止 '+it.deadline+'）'):'')+(s==='doing'?'（进行中）':''));
   i++;
  });
  var need=items.filter(function(it){return it.note&&(it.note.indexOf('待')>=0||it.note.indexOf('等')>=0)}).slice(0,3);
  if(need.length){lines.push('');lines.push('需要您给的：');need.forEach(function(it){lines.push('- '+it.text+(it.note?'（'+it.note+'）':''))})}
 }else{
  var todayItems=items.filter(function(it){
   if(it.priority==='长期')return false;
   var s=st(it.id,it.status);
   var hasTl=tl(it.id).filter(function(x){return x.time.indexOf(t)===0}).length>0;
   var hasStep=false;if(it.steps){it.steps.forEach(function(x){if(S.steps[x.id])hasStep=true})}
   return hasTl||hasStep||s==='done'||s==='doing';
  });
  lines.push('彩怡总，今天进展同步：');
  lines.push('');
  if(!todayItems.length){lines.push('今天还没勾选进展，先把做过的事同步给您：')}
  var i2=1;
  todayItems.forEach(function(it){
   var s=st(it.id,it.status);
   var sn=s==='done'?'已完成':(s==='doing'?'进行中':'待启动');
   var t2=tl(it.id);
   var last=t2.length?t2[t2.length-1].text:'';
   lines.push(i2+'. '+it.text+' —— '+sn);
   if(last)lines.push('   '+last);
   else{var dn=0;if(it.steps&&it.steps.length){it.steps.forEach(function(x){if(S.steps[x.id])dn++});lines.push('   子步骤 '+dn+'/'+it.steps.length)}}
   i2++;
  });
  var wlToday=(D.worklog.items||[]).concat(S.worklog).filter(function(x){return x.date===t});
  if(wlToday.length){lines.push('');lines.push('今天做的事：');wlToday.forEach(function(x){lines.push('- '+x.content)})}
  var pend=items.filter(function(it){return st(it.id,it.status)!=='done'&&it.note&&it.note.indexOf('待确认')>=0});
  if(pend.length){lines.push('');lines.push('待您确认的：');pend.forEach(function(it){lines.push('- '+it.text+'（'+it.note+'）')})}
 }
 var txt=lines.join('\n');
 S.archive.push({time:t+' '+now(),content:txt});save();
 showModal(type==='morning'?'早汇报':'晚汇报',txt);
 renderAll();
}

function exportChanges(){
 var lines=['【工作台变更 '+today()+' '+now()+'】'];
 var c=0;
 Object.keys(S.steps).forEach(function(k){if(S.steps[k]){lines.push('✓ 完成子步骤 '+k);c++}});
 Object.keys(S.status).forEach(function(k){lines.push('○ 状态 '+k+' → '+S.status[k]);c++});
 Object.keys(S.timeline||{}).forEach(function(k){(S.timeline[k]||[]).forEach(function(x){lines.push('＋ 进展 '+k+'：'+x.text);c++})});
 (S.worklog||[]).forEach(function(x){lines.push('＋ 工作日志：'+x.content);c++});
 if(!c)lines.push('（本次无变更）');
 showModal('今日变更 · 复制后发我',lines.join('\n'));
}
function quickNote(){
 var v=prompt('速记一句话（先存下来，之后我帮你归类）');
 if(!v)return;S.notes.push({time:today()+' '+now(),text:v});save();renderAll();
}
function showModal(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').textContent=b;document.getElementById('modal').className='on'}
function closeModal(){document.getElementById('modal').className=''}
function copyModal(){
 var t=document.getElementById('mb').textContent;
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('已复制')},function(){fallback(t)})}
 else fallback(t);
 function fallback(x){var ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制')}
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});
function renderAll(){renderStats();renderReq();renderMem();renderLog();renderAi();renderArch();renderRep()}
renderTabs();renderAll();
</script>
